name: Validate data

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/validate_data.py
      - run: python tools/build_watchlist.py
      - run: python tools/build_partner_pathways.py
      - run: git diff --exit-code -- data/grant-watchlist.json data/partner-pathways.json
